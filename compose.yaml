name: venue-network-operations-console

services:
  telemetry-simulator:
    build:
      context: .
      dockerfile: src/VenueOps.TelemetrySimulator/Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:8080/health/live
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
    volumes:
      - ./infrastructure/blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      telemetry-simulator:
        condition: service_healthy
      blackbox-exporter:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:9090/-/ready
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  venue-api:
    build:
      context: .
      dockerfile: src/VenueOps.Api/Dockerfile
    environment:
      Prometheus__BaseUrl: http://prometheus:9090
      Incidents__Host: incident-db
      Incidents__Database: venueops_incidents
      Incidents__Username: venueops
      Incidents__Password: ${VENUE_INCIDENT_DB_PASSWORD:?Create or preserve the ignored repo-local .env; reuse the SAME password for an existing incident-data volume}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://localhost:8080/health/live
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  incident-db:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: venueops_incidents
      POSTGRES_USER: venueops
      POSTGRES_PASSWORD: ${VENUE_INCIDENT_DB_PASSWORD:?Create or preserve the ignored repo-local .env; reuse the SAME password for an existing incident-data volume}
    volumes:
      - incident-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venueops -d venueops_incidents"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  prometheus-data:
  incident-data:
