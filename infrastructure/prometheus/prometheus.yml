global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: venue-ap-simulator
    metrics_path: /metrics
    static_configs:
      - targets:
          - telemetry-simulator:8080

  - job_name: venue-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - venue-api:8080

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://venue-api:8080/health/live
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - blackbox-exporter:9115
